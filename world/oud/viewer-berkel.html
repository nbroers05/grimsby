<!doctype html>
<html lang="en" class="nh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Shippori+Mincho+B1:wght@700;800&family=VT323&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../housestyle.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  html.nh body { background: #bfe6fa; }
  #view { position: fixed; inset: 0; display: block; }
  .panel { position: fixed; left: 16px; top: 16px; width: 300px; max-height: calc(100% - 32px); overflow: auto; z-index: 2; }
  html.nh .panel.tile { padding: 0 0 12px !important; }
  html.nh .panel > .eyebrow { margin: 0 0 12px; }
  .row { padding: 0 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
  .lbl { width: 100%; font: 400 13px/16px var(--font-pixel); color: var(--nh-muted); }
  .row button { min-height: 32px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--paper-raised); color: var(--ink); font: 400 13px/1 var(--font-pixel); cursor: pointer; }
  .row button[aria-pressed="true"] { background: var(--titlebar); color: #fff; box-shadow: var(--shadow-control); }
  .row select { flex: 1; min-height: 32px; font: 400 13px var(--font-body); }
  .stats { padding: 0 14px; font: 400 13px/18px var(--font-pixel); color: var(--ink); white-space: pre-wrap; margin: 0 0 8px; }
  .credit { padding: 0 14px; font-size: 11px; line-height: 15px; color: var(--nh-muted); margin: 0; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; font: 400 28px var(--font-bar); color: var(--ink); z-index: 1; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div class="loading" id="loading">loading berkel.glb…</div>

<section class="tile panel" aria-label="World check">
  <div class="eyebrow" data-nh-exe="world-check.exe" data-nh-kanji="世界">World check</div>
  <div class="row"><span class="lbl">mood</span>
    <button data-mood="digital">digital future</button><button data-mood="poster">poster</button><button data-mood="titlecard">title card</button>
  </div>
  <div class="row"><span class="lbl">look</span>
    <button id="outline" aria-pressed="false">outline</button>
    <button id="pois" aria-pressed="true">POIs</button>
  </div>
  <div class="row"><span class="lbl">fly to</span><select id="goto"><option value="">centre</option></select></div>
  <pre class="stats" id="stats">…</pre>
  <p class="credit">Buildings © 3DBAG (CC BY 4.0). Map data © OpenStreetMap contributors (ODbL). Drag to pan, right-drag to turn, scroll to zoom.</p>
</section>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { MapControls } from "three/addons/controls/MapControls.js";

const t0 = performance.now();
const canvas = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 20000);
camera.position.set(420, 520, 620);
const controls = new MapControls(camera, canvas);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.46;
controls.minDistance = 30; controls.maxDistance = 9000;

// Soft three-step toon ramp: linear filtering between the steps keeps the edges soft
function ramp(steps) {
  const d = new Uint8Array(steps.flatMap(v => [v, v, v, 255]));
  const t = new THREE.DataTexture(d, steps.length, 1, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.LinearFilter; t.needsUpdate = true; return t;
}
const gradientMap = ramp([150, 150, 205, 205, 255, 255]);

// House style colours, a touch lighter for 3D
const C = {
  ground: "#f3eee3", ground_side: "#cbbfa6", green: "#d3dcb4", water: "#9ccbec",
  paths: "#e3dacb", roads: "#c4bcae", rail: "#8f877a",
  walls: "#f8f4ea", roofs: "#8c95cc", greenhouse: "#bfe1f5",
};
const mats = {};
for (const [k, c] of Object.entries(C)) {
  mats[k] = new THREE.MeshToonMaterial({ color: c, gradientMap });
}
mats.greenhouse.transparent = true; mats.greenhouse.opacity = 0.5; mats.greenhouse.depthWrite = false;
for (const k of ["green", "water", "paths", "roads", "rail"]) { mats[k].polygonOffset = true; mats[k].polygonOffsetFactor = -1; }

const hemi = new THREE.HemisphereLight("#fff6e6", "#1b2a8c", 1.2);
const sun = new THREE.DirectionalLight("#ffffff", 1.6);
sun.position.set(-600, 900, 400);
scene.add(hemi, sun);

const MOODS = {
  digital:   { bg: "#bfe6fa", fog: "#cfeaf8", sky: "#eaf6ff", ground: "#1b2a8c", hemi: 1.25, sun: "#ffffff", sunI: 1.5, sunPos: [-800, 700, 300], walls: "#f8f4ea" },
  poster:    { bg: "#efe9dc", fog: "#efe9dc", sky: "#fff1d8", ground: "#3a3f8f", hemi: 1.1, sun: "#ffe7c4", sunI: 1.7, sunPos: [500, 900, 500], walls: "#f8f4ea" },
  titlecard: { bg: "#0b0b0d", fog: "#0b0b0d", sky: "#2a3570", ground: "#05060c", hemi: 0.55, sun: "#9fb0ff", sunI: 0.35, sunPos: [300, 800, -600], walls: "#b9b4aa" },
};
function setMood(m) {
  const s = MOODS[m];
  scene.background = new THREE.Color(s.bg);
  scene.fog = new THREE.Fog(s.fog, 1800, 7000);
  hemi.color.set(s.sky); hemi.groundColor.set(s.ground); hemi.intensity = s.hemi;
  sun.color.set(s.sun); sun.intensity = s.sunI; sun.position.set(...s.sunPos);
  mats.walls.color.set(s.walls);
  edgeMat.color.set(m === "titlecard" ? "#5c5852" : "#16130f");
  document.body.style.background = s.bg;
  document.querySelectorAll("[data-mood]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mood === m));
}
const edgeMat = new THREE.LineBasicMaterial({ color: "#16130f", transparent: true, opacity: 0.55 });

// The one red thing in the scene: a marker where the bird would be (for now: the station)
const marker = new THREE.Mesh(new THREE.ConeGeometry(4, 14, 4), new THREE.MeshToonMaterial({ color: "#d7261e", gradientMap }));
marker.rotation.x = Math.PI; marker.visible = false;
scene.add(marker);

const draco = new DRACOLoader().setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/");
const loader = new GLTFLoader().setDRACOLoader(draco);

let fileBytes = 0;
const [gltf, poi] = await Promise.all([
  fetch("berkel.glb").then(async r => { const b = await r.arrayBuffer(); fileBytes = b.byteLength; return loader.parseAsync(b, ""); }),
  fetch("poi.json").then(r => r.json()),
]);
const tLoaded = performance.now();
const world = gltf.scene;
const meshes = {};
world.traverse(o => {
  if (!o.isMesh) return;
  meshes[o.name] = o;
  // The .glb carries positions only. Toon has no flatShading switch, so unweld and give every face its own normal.
  o.geometry = o.geometry.toNonIndexed();
  o.geometry.computeVertexNormals();
  o.material = mats[o.name] || mats.walls;
  if (o.name === "greenhouse") o.renderOrder = 2;
});
scene.add(world);
document.getElementById("loading").remove();

// Outline: edges of the buildings, built only when switched on
let edges = null;
document.getElementById("outline").onclick = e => {
  const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  e.currentTarget.setAttribute("aria-pressed", on);
  if (on && !edges) {
    const t = performance.now();
    edges = new THREE.Group();
    for (const k of ["walls", "roofs", "greenhouse"]) {
      if (meshes[k]) edges.add(new THREE.LineSegments(new THREE.EdgesGeometry(meshes[k].geometry, 25), edgeMat));
    }
    scene.add(edges);
    info.edges = `${Math.round(performance.now() - t)} ms to build`;
  }
  if (edges) edges.visible = on;
};

// POIs: small eva dots, one red marker
const cats = {};
const dotGeo = new THREE.SphereGeometry(2.2, 8, 6);
const dotMat = new THREE.MeshToonMaterial({ color: "#1b2a8c", gradientMap });
const dots = new THREE.InstancedMesh(dotGeo, dotMat, poi.pois.length);
const m4 = new THREE.Matrix4();
poi.pois.forEach((p, i) => { m4.makeTranslation(p.x, 4, p.z); dots.setMatrixAt(i, m4); cats[p.category] = (cats[p.category] || 0) + 1; });
scene.add(dots);
document.getElementById("pois").onclick = e => {
  const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  e.currentTarget.setAttribute("aria-pressed", on); dots.visible = on;
};
const sel = document.getElementById("goto");
poi.pois.filter(p => p.name || p.category === "station")
  .sort((a, b) => a.category.localeCompare(b.category) || (a.name || "").localeCompare(b.name || ""))
  .forEach(p => sel.add(new Option(`${p.category}: ${p.name || "(no name)"}`, `${p.x},${p.z}`)));
const station = poi.pois.find(p => p.category === "station" && p.name) || poi.pois.find(p => p.category === "station");
if (station) { marker.position.set(station.x, 26, station.z); marker.visible = true; }
sel.onchange = () => {
  const [x, z] = (sel.value || "0,0").split(",").map(Number);
  const off = camera.position.clone().sub(controls.target).setLength(sel.value ? 260 : 900);
  controls.target.set(x, 0, z); camera.position.set(x, 0, z).add(off);
};

const tris = Object.values(meshes).reduce((s, m) => s + m.geometry.attributes.position.count / 3, 0);
const info = {};
const statsEl = document.getElementById("stats");
let frames = 0, last = performance.now(), fps = 0;
function renderStats() {
  statsEl.textContent =
    `file      ${(fileBytes / 1e6).toFixed(2)} MB\n` +
    `ready in  ${((tLoaded - t0) / 1000).toFixed(2)} s\n` +
    `triangles ${Math.round(tris).toLocaleString("en")}\n` +
    `meshes    ${Object.keys(meshes).length}   fps ${fps}\n` +
    `POIs      ${poi.pois.length}` + (info.edges ? `\noutline   ${info.edges}` : "");
}

const h = new Date().getHours();
setMood(h < 12 && h >= 6 ? "digital" : h >= 12 && h < 18 ? "poster" : "titlecard");
document.querySelectorAll("[data-mood]").forEach(b => b.onclick = () => setMood(b.dataset.mood));
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

renderer.setAnimationLoop(() => {
  controls.update();
  marker.rotation.y += 0.02;
  renderer.render(scene, camera);
  frames++;
  const now = performance.now();
  if (now - last > 1000) { fps = frames; frames = 0; last = now; renderStats(); }
});
renderStats();
window.__world = { info, meshes, tris, fileBytes, ready: (tLoaded - t0), scene, camera, controls, renderer, setMood };
</script>
</body>
</html>
